 fed one at a time to the no_std core compiled to WebAssembly (21,777 bytes), profile</text><text x="138" y="389" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#111111" text-anchor="start">&lt;4, 64, 8></text><text x="48" y="407" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#6b6b6b" text-anchor="start">area</text><text x="138" y="407" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#111111" text-anchor="start">20 s; a 64-sample icon window with 8 histogram bins per channel</text><text x="48" y="425" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#6b6b6b" text-anchor="start">procedure</text><text x="138" y="425" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#111111" text-anchor="start">a sample that passes the activity gate of its channel's window forms an icon; two icons close in time form an index with the</text><text x="138" y="438" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#111111" text-anchor="start">coherence of the pair; a pair whose indices recur enters the vocabulary as a symbol</text><text x="48" y="456" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#6b6b6b" text-anchor="start">record</text><text x="138" y="456" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#111111" text-anchor="start">icons 18 / indices 23 / symbols 7 / first emission at 6.400 s on ch0 / the Rust example reports the same counts</text>
