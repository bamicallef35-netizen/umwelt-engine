name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.95.0 with rustfmt, clippy and the
      # thumbv7em-none-eabihf target; rustup installs them on first use.
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Verify gate
        run: bash scripts/verify.sh
